# Stack percobaan untuk laptop. Jalan di port sementara dan memakai volume sendiri,
# jadi tidak menyentuh database pengembangan (portfolio-postgres) maupun port 3000.
#
# Pakai (dari Ubuntu/WSL, di folder project):
#   docker compose -f compose.test.yaml up -d --build
#   docker compose -f compose.test.yaml down        # hentikan, data tetap ada
#   docker compose -f compose.test.yaml down -v     # hentikan DAN hapus data percobaan
name: portfolio-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test-only-password}
      POSTGRES_DB: portfolio
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    # Hanya untuk tes di laptop: tes otomatis memeriksa isi database dari luar container.
    # Terikat ke loopback, jadi tidak terlihat dari jaringan. Tidak boleh ada di compose.prod.yaml.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Menjalankan "prisma migrate deploy" sekali, lalu selesai. Aplikasi baru dijalankan sesudahnya.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://portfolio:${TEST_DB_PASSWORD:-test-only-password}@postgres:5432/portfolio?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  portfolio:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://portfolio:${TEST_DB_PASSWORD:-test-only-password}@postgres:5432/portfolio?schema=public
      SESSION_SECRET: ${TEST_SESSION_SECRET:-test-only-secret-change-me-0123456789abcdef}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - test_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  test_postgres_data:
  test_uploads:
