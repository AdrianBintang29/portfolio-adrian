services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-adrian:1.0
    container_name: portfolio
    ports:
      - "3000:3000"
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      TZ: Asia/Jakarta
      DISABLE_IPV6: "true"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  portainer_data:
    name: portainer_data
  npm_data:
    name: npm_data
  npm_letsencrypt:
    name: npm_letsencrypt
